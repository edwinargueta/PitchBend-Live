# Backing services for host-native `make dev` (ADR 0004). The app processes (api,
# worker, Vite) run on your machine; only these two run in Docker, so there's no
# Valkey or nginx to install. Ports are published to 127.0.0.1 only.
#
# `make dev` starts these and stops them on exit. `make up` uses
# infra/docker-compose.dev.yml instead and doesn't touch these.
name: pitchbend-live-deps

services:
  valkey:
    # Same pinned image and flags as infra/k8s/valkey.yaml and the Compose stack.
    image: valkey/valkey:9.1.2-trixie
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Serves /media with the real production nginx.conf, reading the host-native API's
  # media directory (.data/media) read-only. Vite proxies /media here.
  media:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine3.24
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.data/media:/data/media:ro
