# Shared audio + SQLite volume (ARCHITECTURE.md §3.2, D7):
#   /data/media/<uuid4>.m4a   playback audio (24 h TTL, deleted by the worker's cleanup cron)
#   /data/db/keyshift.db      SQLite
# api and worker mount it read-write; web mounts it read-only to serve /media.
#
# ReadWriteOnce ties every pod that mounts it to this one node, on purpose
# (CLAUDE.md §5). Don't add a node without first moving to ReadWriteMany storage.
#
# No storageClassName, so the cluster's default StorageClass is used
# (check-cluster.sh verifies there is one). The contents are ephemeral by design:
# the cluster must be rebuildable from these manifests alone.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keyshift-data
  labels:
    app.kubernetes.io/name: keyshift-data
    app.kubernetes.io/part-of: keyshift
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
