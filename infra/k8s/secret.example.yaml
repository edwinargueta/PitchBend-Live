# TEMPLATE ONLY. This file documents the shape of the real Secret; it is not a
# Secret you should apply.
#
# - It must NEVER be listed in kustomization.yaml. Applying it would overwrite
#   the real keyshift-secrets with these placeholders (deploy.sh refuses to
#   apply any rendered output that contains a Secret).
# - Never put real values in this file. The repo is public, and a committed
#   secret is public forever (CLAUDE.md §2).
#
# Create the real Secret once per cluster, as described in the README (deploy.sh
# prints the same commands if it's missing). Run these in bash; zsh's
# `read -p` means something else. The values never appear on a command line,
# in `ps`, or in shell history:
#
#   read -rsp 'DUCKDNS_TOKEN: ' DUCKDNS_TOKEN; echo
#   read -rsp 'SENTRY_DSN (Enter for none): ' SENTRY_DSN; echo
#   kubectl -n keyshift create secret generic keyshift-secrets \
#     --from-file=DUCKDNS_TOKEN=<(printf '%s' "$DUCKDNS_TOKEN") \
#     --from-file=SENTRY_DSN=<(printf '%s' "$SENTRY_DSN")
#   unset DUCKDNS_TOKEN SENTRY_DSN
#
# Keys are the contract in ARCHITECTURE.md §6.2. api and worker get them with
# envFrom; the duckdns CronJob reads only DUCKDNS_TOKEN.
apiVersion: v1
kind: Secret
metadata:
  name: keyshift-secrets
  namespace: keyshift
type: Opaque
stringData:
  DUCKDNS_TOKEN: changeme
  SENTRY_DSN: ""
