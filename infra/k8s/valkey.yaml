# Valkey: ARQ job queue + pub/sub for SSE progress (D5). Same pinned image as
# infra/docker-compose.dev.yml. valkey/valkey is BSD-3-Clause.
#
# Deliberately NOT persistent (ARCHITECTURE.md §3.2): queued jobs are lost if
# Valkey restarts, and clients see an error and retry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: pitchbend-live
spec:
  replicas: 1
  # No persistence to hand over; Recreate avoids two queues existing briefly.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: pitchbend-live
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # uid/gid 999 is the image's `valkey` user. Running as it directly makes
      # the entrypoint skip its root-only chown/setpriv step.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-trixie
          imagePullPolicy: IfNotPresent
          # The entrypoint prepends `valkey-server` when the first arg is a flag.
          #   --save "" / --appendonly no   no RDB snapshots and no AOF (in-memory only)
          #   --maxmemory 64mb              well below the 128Mi container limit, leaving
          #                                 headroom for fragmentation and client buffers
          #                                 so the kernel OOM killer isn't what enforces it
          #   --maxmemory-policy noeviction when full, writes fail loudly (enqueue
          #                                 errors) instead of Valkey silently evicting
          #                                 keys. A job queue must never drop jobs.
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # grep for PONG so an error reply (not just a refused connection) fails too.
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -qx PONG"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -qx PONG"]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: pitchbend-live
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
