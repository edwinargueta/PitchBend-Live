# ARQ worker: the api image with a different command (D16). It consumes jobs
# from Valkey and writes /data/media and SQLite. No Service: nothing connects to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: keyshift
spec:
  # SQLite single writer (CLAUDE.md §5): exactly 1 replica, and Recreate so the
  # old and new pods never overlap during a rollout. See api.yaml.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: keyshift
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Same as api.yaml (either pod may start first on a fresh PVC).
        - name: init-data-dirs
          image: ghcr.io/edwinargueta/keyshift-api:set-by-deploy-sh
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/media /data/db && chmod 0755 /data/media && chmod 0750 /data/db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: worker
          image: ghcr.io/edwinargueta/keyshift-api:set-by-deploy-sh
          imagePullPolicy: IfNotPresent
          command: ["arq", "keyshift.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: keyshift-config
            - secretRef:
                name: keyshift-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # `arq --check` exits 0 only while the worker's health key exists in
          # Valkey. The worker rewrites it every 30 s with a 31 s TTL
          # (health_check_interval in keyshift/worker), so periods stay <= 30 s and
          # failureThreshold >= 3 tolerates one missed refresh. timeoutSeconds is
          # 10 because each probe starts a Python interpreter.
          startupProbe:
            exec:
              command: ["arq", "--check", "keyshift.worker.WorkerSettings"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["arq", "--check", "keyshift.worker.WorkerSettings"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["arq", "--check", "keyshift.worker.WorkerSettings"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keyshift-data
