# PitchBend Live web server: installed as /etc/nginx/conf.d/default.conf in the
# nginxinc/nginx-unprivileged image (runs as uid 101, so it listens on 8080).
#
# Serves two things (ARCHITECTURE.md §4, §9 task 4):
#   /        the SPA from /usr/share/nginx/html (baked into the image)
#   /media/  playback audio from /data/media/ on the shared PVC
#
# SECURITY: the web pod mounts the WHOLE PVC read-only at /data, and that
# includes /data/db/pitchbend-live.db (SQLite). Only /data/media/ may be served.

server {
    listen 8080;
    server_name _;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. text/html is always included when gzip is on.
    # Audio is deliberately absent: AAC is already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # SPA: serve the file if it exists, otherwise fall back to index.html so
    # client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }

    # index.html references hashed bundles, so it must always be revalidated
    # or users keep loading stale builds after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames here, so they can be cached forever.
    # A missing asset is a real 404 (never index.html served as JavaScript).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Playback audio: /media/<uuid4>.m4a -> /data/media/<uuid4>.m4a
    #
    # SECURITY (path traversal): the location and the alias MUST both end in
    # "/". With "location /media" (no slash) + "alias /data/media/", a request
    # for "/media../db/pitchbend-live.db" maps to "/data/media/../db/pitchbend-live.db",
    # i.e. the SQLite DB. "^~" also stops any future regex location from
    # taking over /media/ requests.
    location ^~ /media/ {
        alias /data/media/;

        # Never list the directory: track IDs must stay unguessable and there
        # is no browsable library (CLAUDE.md §4). GET /media/ returns 403.
        autoindex off;

        # Refuse to follow symlinks, so nothing placed in /data/media/ can
        # point outside it.
        disable_symlinks on;

        # No try_files here: it interacts badly with alias, and a missing
        # file must be a plain 404, not the SPA. Media names are random UUIDs
        # that never change content, hence "immutable". add_header (without
        # "always") only applies to 2xx/3xx, so 404s are not cached.
        add_header Cache-Control "public, max-age=86400, immutable";
    }
}
