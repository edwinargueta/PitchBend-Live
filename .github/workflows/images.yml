# Build production images for linux/arm64 and push them to GHCR, tagged with the git SHA
# (never `latest`) — ARCHITECTURE.md §7, D15. Deployment stays manual (infra/scripts/deploy.sh);
# this workflow holds no cluster credentials.
#
# First run: GHCR creates new packages as PRIVATE. Make pitchbend-live-api and pitchbend-live-web public
# once (GitHub → Packages → <package> → Package settings → Change visibility) or the cluster
# can't pull them. deploy.sh checks this before deploying.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # the only workflow with write access, and only to this repo's packages

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pitchbend-live-api
            file: infra/docker/api.Dockerfile
          - image: pitchbend-live-web
            file: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/${{ matrix.image }}"
          echo "tags=${repo}:${GITHUB_SHA},${repo}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-prod
